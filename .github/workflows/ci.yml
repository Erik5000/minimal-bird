name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --disable-sandbox
      - run: bash -n scripts/*.sh
      - run: ./scripts/build-app.sh --universal
      - run: '"build/Minimal Bird.app/Contents/MacOS/MinimalBird" --self-test'
        env:
          MINIMAL_BIRD_SNAPSHOTS: ${{ runner.temp }}/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      - name: Preview snapshots 0 (temporary)
        if: always()
        env:
          PART: "0"
        run: |
          i=0
          for pair in a:composer-drafts b:welcome c:composer; do
            key=${pair%%:*}; f="$RUNNER_TEMP/snapshots/${pair#*:}.png"; [ -f "$f" ] || continue
            sips -Z 640 -s format jpeg -s formatOptions 45 "$f" --out "/tmp/$key.jpg" >/dev/null
            b=$(base64 -i "/tmp/$key.jpg" | tr -d '\n'); n=${#b}; k=0
            while [ $((k*4000)) -lt $n ]; do
              if [ $((i/10)) -eq $PART ]; then echo "::notice title=snap-$key-$k::${b:$((k*4000)):4000}"; fi
              i=$((i+1)); k=$((k+1))
            done
          done
      - name: Preview snapshots 1 (temporary)
