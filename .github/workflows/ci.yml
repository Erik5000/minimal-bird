name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --disable-sandbox
      - run: bash -n scripts/*.sh
      - run: ./scripts/build-app.sh --universal
      - run: '"build/Minimal Bird.app/Contents/MacOS/MinimalBird" --self-test'
        env:
          MINIMAL_BIRD_SNAPSHOTS: ${{ runner.temp }}/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
