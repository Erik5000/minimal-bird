name: macOS checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  check:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --disable-sandbox
      - run: bash -n scripts/*.sh
      - run: ./scripts/build-app.sh --universal
      - run: '"build/Minimal Bird.app/Contents/MacOS/MinimalBird" --self-test'
        env:
          MINIMAL_BIRD_SNAPSHOTS: ${{ runner.temp }}/snapshots
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: window-snapshots
          path: ${{ runner.temp }}/snapshots
          if-no-files-found: ignore
      - name: Preview composer snapshot (temporary)
        if: always()
        run: |
          f="$RUNNER_TEMP/snapshots/composer-drafts.png"; [ -f "$f" ] || exit 0
          sips -s format jpeg -s formatOptions 50 "$f" --out /tmp/a.jpg >/dev/null
          b=$(base64 -i /tmp/a.jpg | tr -d '\n'); n=${#b}; size=$(( (n + 7) / 8 ))
          for i in 0 1 2 3 4 5 6 7; do echo "::notice title=snap-a-$i::${b:$((i*size)):$size}"; done
      - name: Preview welcome snapshot (temporary)
        if: always()
        run: |
          f="$RUNNER_TEMP/snapshots/welcome.png"; [ -f "$f" ] || exit 0
          sips -s format jpeg -s formatOptions 50 "$f" --out /tmp/b.jpg >/dev/null
          b=$(base64 -i /tmp/b.jpg | tr -d '\n'); n=${#b}; size=$(( (n + 7) / 8 ))
          for i in 0 1 2 3 4 5 6 7; do echo "::notice title=snap-b-$i::${b:$((i*size)):$size}"; done
